[project]
name = "prospectly"
version = "0.1.0a1"
description = "Local-first, semi-automated business prospecting & WhatsApp outreach tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "phonenumbers>=8.13",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown excluded: documentation is authored content, never tooling input.
exclude = ["alembic/versions", ".venv", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"] # line length enforced by formatter; B008 = FastAPI Depends() pattern

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true # e.g. phonenumbers ships no type stubs
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
