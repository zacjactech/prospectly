<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reset password · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <!-- Local-first: no email service exists — the reset link is shown here
       (rate limited; documented tradeoff in SECURITY_AND_PRIVACY §3). -->
  <main class="auth-shell">
    <div class="card auth-card">
      <div class="brand auth-brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-text">{{ app_name }}</span>
      </div>
      <h1>Reset your password</h1>
      <p class="muted">This local instance sends no email — the reset link appears on this page.</p>

      {% if error %}
      <div class="flash error" role="alert">{{ error }}</div>
      {% endif %}

      {% if link %}
      <div class="flash success" role="status">
        Reset link for <strong>{{ username }}</strong> (single use, 30 minutes):
        <a href="{{ link }}">{{ link }}</a>
      </div>
      {% else %}
      <form method="post" action="/forgot-password">
        {{ csrf_field() }}
        <div class="form-section full-width">
          <div class="field full">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   autocomplete="username" autofocus required>
          </div>
        </div>
        <div class="action-group">
          <button class="btn primary" type="submit">Create reset link</button>
        </div>
      </form>
      {% endif %}

      <div class="auth-links">
        <a href="/login">Back to sign in</a>
      </div>
    </div>
  </main>
</body>
</html>
