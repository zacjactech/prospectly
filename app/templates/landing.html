<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <!-- Signed-out entry point (owner decision 2026-11-19): the gate used to
       bounce straight to /login, so the app had no front door. Rendered by
       AuthMiddleware before any route runs, so it carries no data at all --
       it cannot query, and it must never grow a metric, name or count. -->
  {% set auth_back_href = "" %}
  {% set auth_back_label = "" %}
  <main class="auth-shell">
    <div class="auth-frame">
    <div class="auth-card">
      <h1>{{ app_name }}</h1>

      <div class="action-group">
        <a class="btn primary" href="/login">Sign in</a>
      </div>

      <div class="auth-links">
        <a href="/forgot-password">Forgot password?</a>
        {% if allow_signup %}<a href="/signup">Create an account</a>{% endif %}
      </div>
    </div>
    {% include "partials/auth_visual.html" %}
    </div>
  </main>
</body>
</html>
