<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <!-- Standalone dark page: centered card + brand lockup, no app chrome
       (spec §2.8 / redesign handoff §3). -->
  <main class="auth-shell">
    <div class="card auth-card">
      <div class="brand auth-brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-text">{{ app_name }}</span>
      </div>
      <h1>Sign in</h1>
      <p class="muted">Sign in with your Prospectly account.</p>

      {% if error %}
      <div class="flash error" role="alert">{{ error }}</div>
      {% endif %}
      {% if notice %}
      <div class="flash success" role="status">{{ notice }}</div>
      {% endif %}

      <form method="post" action="/login">
        {{ csrf_field() }}
        <input type="hidden" name="next" value="{{ next or '/' }}">
        <div class="form-section full-width">
          <div class="field full">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   autocomplete="username" autofocus required>
          </div>
          <div class="field full">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" required>
          </div>
        </div>
        <div class="action-group">
          <button class="btn primary" type="submit">Sign in</button>
        </div>
      </form>

      <div class="auth-links">
        <a href="/forgot-password">Forgot password?</a>
        {% if allow_signup %}<a href="/signup">Create an account</a>{% endif %}
      </div>
    </div>
  </main>
</body>
</html>
