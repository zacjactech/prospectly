<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <span class="brand">{{ app_name }}</span>
      <div class="topbar-right">
        <a href="/" class="btn ghost small">Dashboard</a>
        <a href="/prospects" class="btn ghost small">Prospects</a>
        <a href="/settings/profile" class="btn ghost small">Profile</a>
      </div>
    </header>
    <main class="main">
      <div class="page">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
