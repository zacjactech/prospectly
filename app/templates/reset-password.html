<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Choose a new password · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <main class="auth-shell">
    <div class="card auth-card">
      <div class="brand auth-brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-text">{{ app_name }}</span>
      </div>
      <h1>Choose a new password</h1>
      <p class="muted">Setting a new password signs out every device.</p>

      {% if error %}
      <div class="flash error" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/reset-password">
        {{ csrf_field() }}
        <input type="hidden" name="token" value="{{ token }}">
        <div class="form-section full-width">
          <div class="field full">
            <label for="password">New password</label>
            <input type="password" id="password" name="password"
                   autocomplete="new-password" autofocus required>
          </div>
          <div class="field full">
            <label for="confirm">Confirm new password</label>
            <input type="password" id="confirm" name="confirm"
                   autocomplete="new-password" required>
          </div>
        </div>
        <div class="action-group">
          <button class="btn primary" type="submit">Set new password</button>
        </div>
      </form>

      <div class="auth-links">
        <a href="/login">Back to sign in</a>
      </div>
    </div>
  </main>
</body>
</html>
