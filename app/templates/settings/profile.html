{% extends "base.html" %}
{% block content %}
{% if error %}
<div class="flash error">{{ error }}</div>
{% endif %}

<form method="post" action="/settings/profile">
  <div class="form-section">
    <div class="field full">
      <label>What you offer</label>
      <textarea name="offer" rows="4">{{ profile.offer or '' }}</textarea>
      <p class="hint">e.g. "I build affordable websites for local businesses"</p>
    </div>
  </div>
  <div class="form-section">
    <div class="field">
      <label>Target industries</label>
      <input type="text" name="target_industries" value="{{ (profile.target_industries or [] )|join(', ') }}" placeholder="hotel, event planner, restaurant, retail">
      <p class="hint">Comma-separated.</p>
    </div>
    <div class="field">
      <label>Target locations</label>
      <input type="text" name="target_locations" value="{{ (profile.target_locations or [] )|join(', ') }}" placeholder="city, area, region">
      <p class="hint">Comma-separated cities or areas.</p>
    </div>
  </div>
  <div class="form-section">
    <div class="field full">
      <label>Ideal-client signals</label>
      <input type="text" name="ideal_signals" value="{{ (profile.ideal_signals or [] )|join(', ') }}" placeholder="no website, outdated site, no contact form">
      <p class="hint">Signals that mark a good prospect for automated discovery.</p>
    </div>
  </div>
  <div class="action-group">
    <button class="btn primary">Save profile</button>
    <a href="/" class="btn ghost">Cancel</a>
  </div>
</form>
{% endblock %}
